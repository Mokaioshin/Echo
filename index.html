<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ECHO</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">
    <h1>ECHO</h1>
    <p>Your music. Your atmosphere.</p>

    <button id="spotify-connect">
      Connect with Spotify
    </button>

    <section id="now-playing" class="now-playing hidden">

    <img
      id="album-cover"
      class="album-cover"
      alt="Album cover"
    >

    <div class="track-info">
      <span class="playing-label">NOW PLAYING</span>

      <h2 id="track-title"></h2>

      <p id="track-artist"></p>
    </div>

  </section>

  </main>

  <script src="renderer.js"></script>

</body>
</html>
